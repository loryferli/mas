[project]
name = "mas"
version = "0.1.0"
description = "A multi-agent simulator for on-demand shared mobility on low-flow networks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "matplotlib>=3.11.1",
]

# Only what the reference engine needs at run time, for the harness under `scripts/reference/`:
# `uv run --group reference scripts/reference/run.py ...`.
[dependency-groups]
reference = [
    "networkx",
    "numpy",
]

# `uvx ruff check analysis scripts`: pyflakes, pycodestyle and import order, and nothing a
# per-user configuration could add.
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
